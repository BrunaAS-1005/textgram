<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Textgram da Sala</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: #090d16; color: #f8fafc; padding: 16px; display: flex; justify-content: center; }
    .app-container { width: 100%; max-width: 500px; }
    .card { background: #1e293b; border-radius: 16px; padding: 20px; margin-bottom: 16px; border: 1px solid #334155; }
    .logo { font-size: 24px; font-weight: 800; color: #c084fc; text-align: center; margin-bottom: 16px; }
    input, textarea { width: 100%; background: #0f172a; border: 1px solid #334155; color: #fff; padding: 12px; border-radius: 10px; margin-bottom: 10px; font-size: 14px; outline: none; }
    input:focus, textarea:focus { border-color: #c084fc; }
    .btn { width: 100%; background: #9333ea; color: white; border: none; padding: 12px; border-radius: 10px; font-weight: 700; cursor: pointer; transition: 0.2s; }
    .btn:hover { background: #a855f7; }
    .post { background: #0f172a; border: 1px solid #334155; border-radius: 12px; padding: 16px; margin-top: 12px; }
    .author { color: #c084fc; font-weight: 700; font-size: 14px; }
    .text { font-size: 14px; margin-top: 6px; line-height: 1.4; word-break: break-word; }
    .time { font-size: 11px; color: #64748b; margin-top: 8px; text-align: right; }
  </style>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDummyKeyForTextgramApp2026",
      authDomain: "textgram-sala.firebaseapp.com",
      projectId: "textgram-sala",
      storageBucket: "textgram-sala.appspot.com",
      messagingSenderId: "123456789",
      appId: "1:123456789:web:abcdef"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.publicar = async function() {
      const nome = document.getElementById('nome').value.trim();
      const texto = document.getElementById('texto').value.trim();

      if (!nome || !texto) {
        alert("Preencha o seu nome e a mensagem!");
        return;
      }

      try {
        await addDoc(collection(db, "posts"), {
          nome: nome,
          texto: texto,
          data: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        });
        document.getElementById('texto').value = '';
      } catch (e) {
        alert("Erro ao publicar: " + e.message);
      }
    };

    const q = collection(db, "posts");
    onSnapshot(q, (snapshot) => {
      const mural = document.getElementById('mural');
      mural.innerHTML = '';
      snapshot.forEach((doc) => {
        const post = doc.data();
        const postDiv = document.createElement('div');
        postDiv.className = 'post';
        postDiv.innerHTML = `<div class="author">@${post.nome}</div><div class="text">${post.texto}</div><div class="time">${post.data || ''}</div>`;
        mural.prepend(postDiv);
      });
    });
  </script>
</head>
<body>
  <div class="app-container">
    <div class="logo">✍️ Textgram da Sala</div>

    <div class="card">
      <input type="text" id="nome" placeholder="Seu nome ou apelido" />
      <textarea id="texto" rows="3" placeholder="Escreva sua mensagem para a turma..."></textarea>
      <button class="btn" onclick="publicar()">Publicar no Mural</button>
    </div>

    <div id="mural"></div>
  </div>
</body>
</html>
